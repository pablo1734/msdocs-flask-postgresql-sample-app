<!DOCTYPE html>
<html>
<head>
    <title>Imágenes Subidas</title>
    <link rel="stylesheet" type="text/css"
          href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; }
    </style>
</head>
<body>
    <h1>📊 Imágenes subidas al sistema</h1>
    <table id="tablaImagenes" class="display">
        <thead>
            <tr>
                <th>Archivo</th>
                <th>Rojo</th>
                <th>Verde</th>
                <th>Azul</th>
                <th>Usuario</th>
                <th>Fecha</th>
            </tr>
        </thead>
        <tbody>
            {% for img in images %}
            <tr>
                <td>{{ img.file_name }}</td>
                <td>{{ img.red }}</td>
                <td>{{ img.green }}</td>
                <td>{{ img.blue }}</td>
                <td>{{ img.user }}</td>
                <td>{{ img.timestamp }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        $(document).ready(function () {
            $('#tablaImagenes').DataTable({
                order: [[5, "desc"]]  // Ordenar por fecha descendente
            });
        });
    </script>
</body>
</html>
